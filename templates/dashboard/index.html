<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agents Dashboard — Context-First</title>
<style>
  :root {
    --bg:#0f1420; --panel:#171d2b; --panel2:#1c2436; --border:#2a3346; --text:#e8edf7;
    --muted:#93a0b8; --accent:#5aa8ff;
    --todo:#8b95a8; --run:#f0b429; --done:#3fce7c; --block:#ff5d6c;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:14px 22px;
    border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .project { color:var(--accent); }
  header .meta { margin-left:auto; color:var(--muted); font-size:12px; }

  .sessions { padding:20px 22px; display:flex; flex-direction:column; gap:26px; }
  .session { border:1px solid var(--border); border-radius:12px; background:var(--panel); overflow:hidden; }
  .session > .bar { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); }
  .session .id { font-weight:700; font-size:15px; }
  .session .title { color:var(--muted); }
  .session .spacer { flex:1; }
  .pill { font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; }
  .pill.simple{ background:#1c3a2a; color:#6ee7a0; } .pill.medium{ background:#3a331c; color:#f0d264; } .pill.complex{ background:#3a1c22; color:#ff98a3; }
  .pill.st-planned{ background:#2a3346; color:#c4cede; } .pill.st-running{ background:#3a331c; color:#f0b429; }
  .pill.st-done{ background:#1c3a2a; color:#3fce7c; } .pill.st-blocked{ background:#3a1c22; color:#ff5d6c; }
  .pill.st-unknown{ background:#2a3346; color:#93a0b8; }
  .progress { height:6px; background:#0e1420; }
  .progress > i { display:block; height:100%; background:var(--done); transition:width .5s; }

  /* live / idle / stale indicators */
  .live { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:#3fce7c;
    background:#12281c; padding:4px 11px; border-radius:20px; }
  .live > i { width:8px; height:8px; border-radius:50%; background:#3fce7c; box-shadow:0 0 0 0 #3fce7c;
    animation:ping 1.3s ease-out infinite; }
  @keyframes ping { 0%{box-shadow:0 0 0 0 #3fce7c99} 70%{box-shadow:0 0 0 7px #3fce7c00} 100%{box-shadow:0 0 0 0 #3fce7c00} }
  .stale { font-size:12px; color:#f0b429; background:#2a2410; padding:4px 11px; border-radius:20px; }
  .idle { font-size:12px; color:var(--muted); }

  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); }
  @media(max-width:820px){ .board{ grid-template-columns:1fr 1fr; } }
  .col { background:var(--panel); min-height:80px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .col > h3 { margin:0 0 2px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    display:flex; align-items:center; gap:7px; }
  .col .cdot { width:8px; height:8px; border-radius:50%; }
  .col.todo  .cdot{ background:var(--todo); }  .col.run .cdot{ background:var(--run); }
  .col.done  .cdot{ background:var(--done); }  .col.block .cdot{ background:var(--block); }
  .col .k { margin-left:auto; font-size:11px; color:var(--muted); }
  .col.run.active { background:linear-gradient(180deg,rgba(240,180,41,.12),transparent 60%); box-shadow:inset 0 2px 0 var(--run); }
  .col .empty { color:#5c6780; font-size:12px; font-style:italic; padding:6px 2px; }

  .card { border:1px solid var(--border); border-radius:9px; background:var(--panel2); padding:11px 12px; }
  .card.running { border-color:#5a4d1e; box-shadow:0 0 0 1px #f0b42933; }
  .card.blocked { border-color:#5a2530; }
  .card .top { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .card .ic { font-size:15px; line-height:1; }
  .card .wid { font-weight:700; font-size:13px; }
  .card .role { font-size:11px; color:var(--accent); font-weight:600; }
  .card .repo { margin-left:auto; font-size:11px; color:var(--muted); background:#0e1420; padding:2px 7px; border-radius:5px; }
  .card .obj { font-size:12.5px; color:#cdd6e6; }
  .card .step { margin-top:6px; font-size:12px; color:var(--run); display:flex; align-items:center; gap:6px; }
  .card .step .spin { width:10px; height:10px; border:2px solid #f0b429; border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  .card .dep { margin-top:5px; font-size:11px; color:var(--muted); }
  .card .verdict { margin-top:6px; display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px; }
  .verdict.ok { background:#1c3a2a; color:#3fce7c; } .verdict.bad { background:#3a1c22; color:#ff5d6c; }
  .col .empty { color:#5c6780; font-size:12px; font-style:italic; padding:6px 2px; }

  @keyframes spin { to{ transform:rotate(360deg); } }
  .note { font-size:11px; color:#f0b429; margin-left:6px; }
  .page-empty { color:var(--muted); text-align:center; padding:60px; }
  code { background:#0e1420; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>Agents Dashboard · <span class="project" id="project">…</span></h1>
  <div class="meta"><span id="count">0</span> sessions · auto-refresh 1.5s</div>
</header>
<div class="sessions" id="root"><div class="page-empty">Loading…</div></div>

<script>
const ROLE_ICON = { implementer:'🔨', integrator:'🔗', reviewer:'🔍', tester:'🧪', planner:'🗺️', researcher:'📚' };
const COLS = [
  { key:'todo',  label:'To do',    match:w=>w.status==='pending'||w.status==='unknown' },
  { key:'run',   label:'Working',  match:w=>w.status==='running' },
  { key:'done',  label:'Done',     match:w=>w.status==='done' },
  { key:'block', label:'Blocked',  match:w=>w.status==='blocked' },
];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const okVerdict=v=>/pass|green|consistent|done|ok/i.test(v||'');

function card(w){
  const c = el('div','card '+(w.status||''));
  const top = el('div','top');
  top.appendChild(el('span','ic', ROLE_ICON[w.archetype]||'🤖'));
  top.appendChild(el('span','wid', esc(w.id||'')));
  top.appendChild(el('span','role', esc(w.archetype||'')));
  if(w.repository) top.appendChild(el('span','repo', esc(w.repository)));
  c.appendChild(top);

  if(w.objective) c.appendChild(el('div','obj', esc(w.objective)));

  if(w.status==='running' && w.currentStep){
    const s = el('div','step'); s.appendChild(el('span','spin'));
    s.appendChild(el('span',null,esc(w.currentStep))); c.appendChild(s);
  }
  if((w.dependsOn||[]).length && w.status!=='done')
    c.appendChild(el('div','dep','⤷ waiting on '+esc(w.dependsOn.join(', '))));
  if(w.verdict)
    c.appendChild(el('div','verdict '+(okVerdict(w.verdict)?'ok':'bad'), esc(w.verdict)));
  return c;
}

function ago(iso){
  if(!iso) return null;
  const sec = Math.round((Date.now()-new Date(iso).getTime())/1000);
  if(sec<0) return '0s';
  if(sec<60) return sec+'s';
  if(sec<3600) return Math.round(sec/60)+'m';
  return Math.round(sec/3600)+'h';
}

function session(s){
  const box = el('div','session');
  const ws = s.workers||[];
  const running = ws.filter(w=>w.status==='running').length;
  const sinceSec = s.updatedAt ? (Date.now()-new Date(s.updatedAt).getTime())/1000 : Infinity;
  // "live" only if something is running AND the file changed very recently
  const isLive = running>0 && sinceSec < 20;

  const bar = el('div','bar');
  bar.appendChild(el('span','id', esc(s.issueId)));
  if(s.title) bar.appendChild(el('span','title', esc(s.title)));
  bar.appendChild(el('span','spacer'));
  if(s.fromPlanFallback) bar.appendChild(el('span','note','planned view (no live state)'));

  // Live/idle indicator — answers "is anything actually running?"
  if(isLive){
    bar.appendChild(el('span','live','<i></i>LIVE · '+running+' working'));
  } else if(running>0){
    bar.appendChild(el('span','stale','⏸ '+running+' marked running · no update for '+ago(s.updatedAt)));
  } else if(s.updatedAt){
    bar.appendChild(el('span','idle','idle · last activity '+ago(s.updatedAt)+' ago'));
  }

  if(s.complexity) bar.appendChild(el('span','pill '+s.complexity, esc(s.complexity)));
  bar.appendChild(el('span','pill st-'+(s.status||'unknown'), esc(s.status||'unknown')));
  box.appendChild(bar);

  const total = ws.length, done = ws.filter(w=>w.status==='done').length;
  const prog = el('div','progress'); prog.appendChild(el('i',null,''));
  prog.firstChild.style.width = total? Math.round(done/total*100)+'%' : '0%';
  box.appendChild(prog);

  const board = el('div','board');
  for(const col of COLS){
    const items = ws.filter(col.match);
    const c = el('div','col '+col.key);
    if(col.key==='run' && (isLive || running>0)) c.classList.add('active');
    const h = el('h3',null,'<span class="cdot"></span>'+col.label);
    h.appendChild(el('span','k', String(items.length)));
    c.appendChild(h);
    if(!items.length){
      const msg = col.key==='run' ? 'nobody working right now' : '—';
      c.appendChild(el('div','empty', msg));
    }
    items.forEach(w=>c.appendChild(card(w)));
    board.appendChild(c);
  }
  box.appendChild(board);
  return box;
}

async function refresh(){
  try{
    const data = await (await fetch('/api/sessions')).json();
    document.getElementById('project').textContent = data.project||'orchestrator';
    document.getElementById('count').textContent = (data.sessions||[]).length;
    const root = document.getElementById('root'); root.innerHTML='';
    if(!(data.sessions||[]).length){ root.appendChild(el('div','page-empty','No sessions yet. Run <code>/orchestrate &lt;ISSUE-ID&gt;</code>.')); return; }
    data.sessions.sort((a,b)=>(b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||''));
    data.sessions.forEach(s=>root.appendChild(session(s)));
  }catch(e){
    document.getElementById('root').innerHTML='<div class="page-empty">Server unreachable — is <code>context-agents dashboard</code> running?</div>';
  }
}
refresh(); setInterval(refresh,1500);
</script>
</body>
</html>
