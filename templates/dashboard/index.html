<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agents Dashboard — Context-First</title>
<style>
  :root {
    --bg:#0f1420; --panel:#171d2b; --panel2:#1c2436; --border:#2a3346; --text:#e8edf7;
    --muted:#93a0b8; --accent:#5aa8ff;
    --todo:#8b95a8; --run:#f0b429; --done:#3fce7c; --block:#ff5d6c;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif; }
  a { color:inherit; text-decoration:none; }
  code { background:#0e1420; padding:1px 5px; border-radius:4px; font-size:12px; }

  header { display:flex; align-items:center; gap:14px; padding:14px 22px;
    border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:20; flex-wrap:wrap; }
  @media(max-width:640px){ header { padding:12px 14px; gap:10px; } }
  header h1 { font-size:15px; margin:0; font-weight:600; cursor:pointer; }
  header .crumb { color:var(--accent); }
  .nav { display:flex; gap:4px; }
  .navlink { font-size:12px; color:var(--muted); padding:5px 11px; border-radius:7px; border:1px solid transparent; }
  .navlink:hover { color:var(--text); background:#1c2436; }
  .navlink.on { color:var(--text); background:#1c2436; border-color:var(--border); }

  /* ---- Map view ---- */
  .map-toolbar { display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button { background:transparent; color:var(--muted); border:0; padding:7px 13px; font-size:12px; cursor:pointer; font-family:inherit; }
  .seg button + button { border-left:1px solid var(--border); }
  .seg button.on { background:var(--accent); color:#08111f; font-weight:600; }
  .map-filter { display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); }
  .map-filter select { background:#0e1420; color:var(--text); border:1px solid var(--border); border-radius:7px; padding:5px 8px; font-family:inherit; font-size:12px; }
  .map-stage { position:relative; border:1px solid var(--border); border-radius:12px; background:radial-gradient(circle at 50% 40%, #131c2e 0%, #0e1420 70%); min-height:70vh; overflow:hidden; }
  .map-stage svg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  .map-stage svg.grabbing { cursor:grabbing; }
  .map-stage:fullscreen { border-radius:0; min-height:100vh; }
  .map-stage.fs { min-height:100vh; }
  .fs-btn { font-size:12px; color:var(--muted); background:#0e1420; border:1px solid var(--border); border-radius:7px; padding:6px 11px; cursor:pointer; font-family:inherit; }
  .fs-btn:hover { border-color:var(--accent); color:var(--text); }
  .zoom-ctrl { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:4px; z-index:3; }
  .zoom-ctrl button { width:30px; height:30px; font-size:16px; background:#0e1420cc; color:var(--text); border:1px solid var(--border); border-radius:7px; cursor:pointer; line-height:1; }
  .zoom-ctrl button:hover { border-color:var(--accent); }
  .zoom-hint { position:absolute; left:12px; bottom:12px; font-size:10px; color:#5c6780; z-index:3; pointer-events:none; }

  /* radial / force nodes */
  .mnode { cursor:pointer; }
  .mnode circle { transition:.2s; }
  .mnode text { font-size:11px; fill:var(--text); pointer-events:none; }
  .mnode .sub { fill:var(--muted); font-size:10px; }
  .medge { stroke:#2a3346; fill:none; }
  .medge.hot { stroke:#f0b429; opacity:.55; }
  .n-center circle { fill:#243049; stroke:#3a4560; stroke-width:2; }
  .n-project circle { fill:#1c2a44; stroke:#345; stroke-width:1.5; }
  .n-session circle { fill:#1c2436; stroke:#2a3346; }
  .n-agent circle { stroke-width:1.5; }
  .n-agent.running circle { fill:#3a2e0c; stroke:#f0b429; }
  .n-agent.done circle { fill:#123020; stroke:#3fce7c; }
  .n-agent.blocked circle { fill:#2a1418; stroke:#ff5d6c; }
  .n-agent.pending circle, .n-agent.unknown circle { fill:#1a2130; stroke:#4a5570; }
  .pulse { animation:mpulse 1.4s ease-out infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes mpulse { 0%,100%{ opacity:1 } 50%{ opacity:.35 } }

  /* bubbles layout */
  .islands { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .island { border:1px solid var(--border); border-radius:14px; background:var(--panel); padding:16px; }
  .island.dim { opacity:.5; }
  .island .ihead { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .island .iname { font-weight:700; font-size:15px; }
  .island .ibadge { margin-left:auto; font-size:11px; color:var(--muted); }
  .island .ibadge b { color:var(--run); }
  .bubbles { display:flex; flex-wrap:wrap; gap:8px; }
  .bub { display:flex; align-items:center; gap:6px; font-size:11px; padding:5px 9px; border-radius:20px; border:1px solid var(--border); cursor:default; }
  .bub .bd { width:8px; height:8px; border-radius:50%; }
  .bub.running { background:#2a2410; } .bub.running .bd{ background:var(--run); animation:mpulse 1.4s infinite; }
  .bub.done { background:#12281c; } .bub.done .bd{ background:var(--done); }
  .bub.blocked { background:#2a1418; } .bub.blocked .bd{ background:var(--block); }
  .bub.pending .bd, .bub.unknown .bd { background:var(--todo); }
  .island .empty-sess { color:#5c6780; font-size:12px; font-style:italic; }
  .island .sess-row { margin-bottom:12px; }
  .island .sess-row .sr-title { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .island .sess-row .sr-title b { color:var(--text); }
  header .meta { margin-left:auto; color:var(--muted); font-size:12px; display:flex; align-items:center; gap:14px; }
  .switch { display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none; font-size:12px; }
  .switch input { display:none; }
  .switch .track { width:34px; height:18px; border-radius:20px; background:#2a3346; position:relative; transition:.2s; }
  .switch .track:after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#8b95a8; transition:.2s; }
  .switch input:checked + .track { background:#1c4a2e; }
  .switch input:checked + .track:after { left:18px; background:var(--done); }

  .wrap { padding:22px; max-width:1600px; margin:0 auto; }
  @media(max-width:640px){ .wrap { padding:12px; } }

  /* ---------- projects landing ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .pcard { border:1px solid var(--border); border-radius:12px; background:var(--panel); padding:16px 18px;
    cursor:pointer; transition:.15s; display:block; }
  .pcard:hover { border-color:var(--accent); transform:translateY(-2px); }
  .pcard .pname { font-size:16px; font-weight:700; margin-bottom:4px; }
  .pcard .ppath { font-size:11px; color:var(--muted); word-break:break-all; margin-bottom:12px; }
  .pcard .pstats { display:flex; gap:14px; font-size:13px; }
  .pcard .stat b { color:var(--text); } .pcard .stat span { color:var(--muted); }
  .pcard .live-badge { display:inline-flex; align-items:center; gap:6px; color:var(--done); font-weight:600; }
  .pcard .live-badge i { width:8px;height:8px;border-radius:50%;background:var(--done); animation:ping 1.3s ease-out infinite; }

  /* ---------- kanban ---------- */
  .sessions { display:flex; flex-direction:column; gap:16px; }
  .session { border:1px solid var(--border); border-radius:12px; background:var(--panel); overflow:hidden; }
  .session > .bar { display:flex; align-items:center; gap:10px; padding:13px 16px; cursor:pointer; flex-wrap:wrap; }
  .session .caret { transition:.2s; color:var(--muted); font-size:12px; }
  .session.collapsed .caret { transform:rotate(-90deg); }
  .session .id { font-weight:700; font-size:15px; white-space:nowrap; }
  .session .sep { color:#4a5570; }
  .session .title { color:var(--text); font-size:14px; min-width:120px; flex:1 1 auto; }
  .session .spacer { flex:1; }
  .pill { font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; }
  .pill.simple{ background:#1c3a2a; color:#6ee7a0; } .pill.medium{ background:#3a331c; color:#f0d264; } .pill.complex{ background:#3a1c22; color:#ff98a3; }
  .pill.st-planned{ background:#2a3346; color:#c4cede; } .pill.st-running{ background:#3a331c; color:#f0b429; }
  .pill.st-done{ background:#1c3a2a; color:#3fce7c; } .pill.st-blocked{ background:#3a1c22; color:#ff5d6c; } .pill.st-unknown{ background:#2a3346; color:#93a0b8; }
  .live { display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:#3fce7c; background:#12281c; padding:4px 11px; border-radius:20px; }
  .live > i { width:8px; height:8px; border-radius:50%; background:#3fce7c; animation:ping 1.3s ease-out infinite; }
  @keyframes ping { 0%{box-shadow:0 0 0 0 #3fce7c99} 70%{box-shadow:0 0 0 7px #3fce7c00} 100%{box-shadow:0 0 0 0 #3fce7c00} }
  .stale { font-size:12px; color:#f0b429; } .idle { font-size:12px; color:var(--muted); }
  .progress { height:6px; background:#0e1420; }
  .progress > i { display:block; height:100%; background:var(--done); transition:width .5s; }

  /* pipeline stepper */
  .stepper { display:flex; align-items:center; gap:0; padding:10px 16px; background:#131a28; border-top:1px solid var(--border); flex-wrap:wrap; }
  .sstep { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; border:1px solid var(--border); }
  .sstep .sdot { width:14px; text-align:center; font-size:10px; }
  .sstep.done { color:var(--done); background:#12281c; border-color:#1c3a2a; }
  .sstep.cur { color:var(--run); background:#2a2410; border-color:#5a4d1e; }
  .sstep.cur .sdot { animation:ping 1.3s infinite; }
  .sstep.pending { color:var(--muted); background:transparent; }
  .sline { width:22px; height:2px; background:var(--border); margin:0 2px; }
  .sline.on { background:var(--done); }
  .body { display:block; }
  .session.collapsed .body { display:none; }

  /* Fluid board: columns wrap based on available width instead of forcing 4 across. */
  .board { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:var(--border); }
  @media(max-width:1180px){ .board{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:560px){ .board{ grid-template-columns:1fr; } }
  .col { background:var(--panel); min-height:70px; padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .col > h3 { margin:0; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .col .cdot { width:8px; height:8px; border-radius:50%; }
  .col.todo .cdot{ background:var(--todo); } .col.run .cdot{ background:var(--run); }
  .col.done .cdot{ background:var(--done); } .col.block .cdot{ background:var(--block); }
  .col .k { margin-left:auto; font-size:11px; color:var(--muted); }
  .col.run.active { background:linear-gradient(180deg,rgba(240,180,41,.12),transparent 60%); box-shadow:inset 0 2px 0 var(--run); }

  .card { border:1px solid var(--border); border-radius:9px; background:var(--panel2); padding:11px 12px; min-width:0; overflow-wrap:anywhere; }
  .card.running { border-color:#5a4d1e; box-shadow:0 0 0 1px #f0b42933; }
  .card.blocked { border-color:#5a2530; }
  .card .top { display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }
  .card .ic { font-size:15px; } .card .nm { font-weight:700; font-size:13px; }
  .card .role { font-size:11px; color:var(--accent); font-weight:600; }
  .card .repo { margin-left:auto; font-size:11px; color:var(--muted); background:#0e1420; padding:2px 7px; border-radius:5px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .obj { font-size:12.5px; color:#cdd6e6; cursor:pointer; }
  .card .obj:hover { color:#fff; }
  /* multi-line ellipsis: cap text height, show … when longer */
  .clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .clamp1 { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .card .step { margin-top:6px; font-size:12px; color:var(--run); display:flex; align-items:center; gap:6px; }
  .card .step .spin { width:10px; height:10px; border:2px solid #f0b429; border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; }
  .card .dep { margin-top:5px; font-size:11px; color:var(--muted); }
  /* verdict as a fixed-height quadrant with ellipsis + click-to-expand */
  .verdict-box { margin-top:8px; padding:8px 9px; border-radius:6px; cursor:pointer; }
  .verdict-box.ok { background:#12281c; border:1px solid #1c3a2a; }
  .verdict-box.bad { background:#2a1418; border:1px solid #3a1c22; }
  .verdict-txt { font-size:11.5px; font-weight:600; line-height:1.45; }
  .verdict-box.ok .verdict-txt { color:#5dff9b; }
  .verdict-box.bad .verdict-txt { color:#ff8b95; }
  .verdict-box:hover { filter:brightness(1.15); }
  /* footer: buttons on their own row, full width */
  .card .foot { margin-top:8px; display:flex; }
  .steps-btn { width:100%; font-size:11px; color:var(--accent); background:#0e1420; border:1px solid var(--border);
    border-radius:6px; padding:6px 8px; cursor:pointer; text-align:center; }
  .steps-btn:hover { border-color:var(--accent); background:#101a2e; }
  @keyframes spin { to{ transform:rotate(360deg); } }

  /* ---------- modal ---------- */
  .modal-bg { position:fixed; inset:0; background:#000a; display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal { width:min(560px,92vw); max-height:80vh; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:14px; }
  .modal .mh { display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); }
  .modal .mh .x { margin-left:auto; cursor:pointer; color:var(--muted); font-size:18px; }
  .modal-text { padding:16px 18px; font-size:13.5px; line-height:1.6; color:#dfe7f5; white-space:pre-wrap; word-break:break-word; }
  .timeline { padding:14px 18px; }
  .tl { position:relative; padding:0 0 0 22px; }
  .tl:before { content:''; position:absolute; left:6px; top:4px; bottom:4px; width:2px; background:var(--border); }
  .tl .ev { position:relative; padding:6px 0; }
  .tl .ev:before { content:''; position:absolute; left:-19px; top:10px; width:10px; height:10px; border-radius:50%; background:var(--accent); border:2px solid var(--panel); }
  .tl .ev.cur:before { background:var(--run); animation:ping 1.3s infinite; }
  .tl .ev .t { font-size:11px; color:var(--muted); }
  .tl .ev .s { font-size:13px; }

  .page-empty { color:var(--muted); text-align:center; padding:60px; }
</style>
</head>
<body>
<header>
  <h1 id="home">Agents Dashboard</h1>
  <span class="crumb" id="crumb"></span>
  <nav class="nav" id="nav">
    <a class="navlink" id="navBoard" href="?">Board</a>
    <a class="navlink" id="navMap" href="?view=map">🧠 Map</a>
  </nav>
  <div class="meta">
    <label class="switch" id="activeToggleWrap" style="display:none">
      <input type="checkbox" id="activeOnly"><span class="track"></span>active only
    </label>
    <span id="metaText">…</span>
  </div>
</header>
<div class="wrap" id="root"><div class="page-empty">Loading…</div></div>
<div id="modalRoot"></div>

<script>
const ROLE_ICON = { implementer:'🔨', integrator:'🔗', reviewer:'🔍', tester:'🧪', planner:'🗺️', researcher:'📚' };
const COLS = [
  { key:'todo',  label:'To do',   match:w=>w.status==='pending'||w.status==='unknown' },
  { key:'run',   label:'Working', match:w=>w.status==='running' },
  { key:'done',  label:'Done',    match:w=>w.status==='done' },
  { key:'block', label:'Blocked', match:w=>w.status==='blocked' },
];
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const okVerdict=v=>/pass|green|consistent|done|ok/i.test(v||'');
const qs=k=>new URLSearchParams(location.search).get(k);
const nameOf=w=> w.name || (w.archetype? (w.archetype+(w.id?(' '+w.id):'')) : (w.id||'agent'));
function ago(iso){ if(!iso) return null; let s=Math.round((Date.now()-new Date(iso))/1000); if(s<0)s=0;
  if(s<60)return s+'s'; if(s<3600)return Math.round(s/60)+'m'; return Math.round(s/3600)+'h'; }

const collapsed = new Set(JSON.parse(localStorage.getItem('cfa_collapsed')||'[]'));
const saveCollapsed=()=>localStorage.setItem('cfa_collapsed',JSON.stringify([...collapsed]));
let activeOnly = localStorage.getItem('cfa_activeOnly')==='1';

/* ---------------- modal (step history / pipeline) ---------------- */
function openStepsModal(w){
  const bg = el('div','modal-bg');
  bg.addEventListener('click',e=>{ if(e.target===bg) bg.remove(); });
  const m = el('div','modal');
  const h = el('div','mh');
  h.appendChild(el('span','ic',ROLE_ICON[w.archetype]||'🤖'));
  h.appendChild(el('strong',null,esc(nameOf(w))));
  h.appendChild(el('span','role',esc(w.archetype||'')));
  const x = el('span','x','✕'); x.onclick=()=>bg.remove(); h.appendChild(x);
  m.appendChild(h);

  const tl = el('div','timeline');
  const steps = (w.steps&&w.steps.length) ? w.steps
    : (w.currentStep? [{step:w.currentStep, at:w.startedAt}] : []);
  if(!steps.length){ tl.appendChild(el('div','page-empty','No step history recorded yet.')); }
  else {
    const line = el('div','tl');
    steps.forEach((s,i)=>{
      const isCur = w.status==='running' && i===steps.length-1;
      const ev = el('div','ev'+(isCur?' cur':''));
      ev.appendChild(el('div','t', esc(s.at? new Date(s.at).toLocaleTimeString():'')));
      ev.appendChild(el('div','s', esc(typeof s==='string'?s:s.step)));
      line.appendChild(ev);
    });
    tl.appendChild(line);
  }
  m.appendChild(tl);
  bg.appendChild(m);
  document.getElementById('modalRoot').appendChild(bg);
}

/* generic text modal (full verdict / full objective) */
function openTextModal(w, heading, text){
  const bg = el('div','modal-bg');
  bg.addEventListener('click',e=>{ if(e.target===bg) bg.remove(); });
  const m = el('div','modal');
  const h = el('div','mh');
  h.appendChild(el('span','ic',ROLE_ICON[w.archetype]||'🤖'));
  h.appendChild(el('strong',null,esc(nameOf(w))+' — '+esc(heading)));
  const x = el('span','x','✕'); x.onclick=()=>bg.remove(); h.appendChild(x);
  m.appendChild(h);
  m.appendChild(el('div','modal-text', esc(text)));
  bg.appendChild(m);
  document.getElementById('modalRoot').appendChild(bg);
}

/* ---------------- agent card ---------------- */
function card(w){
  const c = el('div','card '+(w.status||''));
  const top = el('div','top');
  top.appendChild(el('span','ic', ROLE_ICON[w.archetype]||'🤖'));
  top.appendChild(el('span','nm', esc(nameOf(w))));
  top.appendChild(el('span','role', esc(w.archetype||'')));
  if(w.repository) top.appendChild(el('span','repo', esc(w.repository)));
  c.appendChild(top);
  if(w.objective){
    const o=el('div','obj clamp', esc(w.objective));
    o.title='clique para ver tudo';
    o.onclick=()=>openTextModal(w,'objective',w.objective);
    c.appendChild(o);
  }
  if(w.status==='running' && w.currentStep){
    const s=el('div','step'); s.appendChild(el('span','spin')); s.appendChild(el('span','clamp1',esc(w.currentStep))); c.appendChild(s);
  }
  if((w.dependsOn||[]).length && w.status!=='done')
    c.appendChild(el('div','dep','⤷ waiting on '+esc(w.dependsOn.join(', '))));

  // verdict: fixed-height block, ellipsis if long, click → modal with full text
  if(w.verdict){
    const v=el('div','verdict-box '+(okVerdict(w.verdict)?'ok':'bad'));
    v.appendChild(el('div','verdict-txt clamp', esc(w.verdict)));
    v.title='clique para ver tudo'; v.onclick=()=>openTextModal(w,'verdict',w.verdict);
    c.appendChild(v);
  }

  // footer: action buttons on their own row, full width
  const hasHistory = (w.steps&&w.steps.length) || w.currentStep;
  if(hasHistory){
    const foot = el('div','foot');
    const b=el('button','steps-btn','⧗ pipeline'+((w.steps&&w.steps.length)?(' ('+w.steps.length+')'):''));
    b.onclick=()=>openStepsModal(w); foot.appendChild(b);
    c.appendChild(foot);
  }
  return c;
}

/* ---------------- pipeline stepper ---------------- */
function stepper(stages){
  // current = first pending stage (the one to do next); done stages are green
  let curIdx = stages.findIndex(st=>st.status!=='done');
  const wrap = el('div','stepper');
  stages.forEach((st,i)=>{
    if(i>0) wrap.appendChild(el('span','sline'+(stages[i-1].status==='done'?' on':'')));
    const cls = st.status==='done' ? 'done' : (i===curIdx ? 'cur' : 'pending');
    const node = el('span','sstep '+cls);
    node.appendChild(el('span','sdot', st.status==='done'?'✓':(i===curIdx?'▸':'')));
    node.appendChild(el('span','slabel', esc(st.label)));
    if(st.at) node.title = st.label+' — '+new Date(st.at).toLocaleString();
    wrap.appendChild(node);
  });
  return wrap;
}

/* ---------------- session (accordion) ---------------- */
function session(s){
  const ws = s.workers||[];
  const running = ws.filter(w=>w.status==='running').length;
  const sinceSec = s.updatedAt ? (Date.now()-new Date(s.updatedAt))/1000 : Infinity;
  const isLive = running>0 && sinceSec<20;
  const isCollapsed = collapsed.has(s.issueId);

  const box = el('div','session'+(isCollapsed?' collapsed':''));
  const bar = el('div','bar');
  bar.appendChild(el('span','caret','▾'));
  bar.appendChild(el('span','id', esc(s.issueId)));
  if(s.title){ bar.appendChild(el('span','sep','·')); bar.appendChild(el('span','title', esc(s.title))); }
  bar.appendChild(el('span','spacer'));
  if(s.fromPlanFallback) bar.appendChild(el('span','idle','planned view'));
  if(isLive) bar.appendChild(el('span','live','<i></i>LIVE · '+running+' working'));
  else if(running>0) bar.appendChild(el('span','stale','⏸ '+running+' running · '+ago(s.updatedAt)+' ago'));
  else if(s.updatedAt) bar.appendChild(el('span','idle','idle · '+ago(s.updatedAt)+' ago'));
  if(s.complexity) bar.appendChild(el('span','pill '+s.complexity, esc(s.complexity)));
  bar.appendChild(el('span','pill st-'+(s.status||'unknown'), esc(s.status||'unknown')));
  bar.onclick=()=>{ if(collapsed.has(s.issueId)) collapsed.delete(s.issueId); else collapsed.add(s.issueId); saveCollapsed(); render(); };
  box.appendChild(bar);

  // pipeline stepper (refine → spec → orchestrate → pr), derived from artifacts on disk
  if(s.pipeline&&s.pipeline.length) box.appendChild(stepper(s.pipeline));

  const total=ws.length, done=ws.filter(w=>w.status==='done').length;
  const prog=el('div','progress'); const bar2=el('i'); bar2.style.width=total?Math.round(done/total*100)+'%':'0%'; prog.appendChild(bar2); box.appendChild(prog);

  const body=el('div','body'); const board=el('div','board');
  for(const col of COLS){
    let items=ws.filter(col.match);
    const c=el('div','col '+col.key);
    if(col.key==='run' && running>0) c.classList.add('active');
    const h=el('h3',null,'<span class="cdot"></span>'+col.label); h.appendChild(el('span','k',String(items.length))); c.appendChild(h);
    if(!items.length) c.appendChild(el('div','empty', col.key==='run'?'nobody working':'—'));
    items.forEach(w=>c.appendChild(card(w)));
    board.appendChild(c);
  }
  body.appendChild(board); box.appendChild(body);
  return box;
}

// remembered zoom/pan per stage session, so refreshes don't reset the view
let mapView = { k:1, x:0, y:0, init:false };

/* Wrap SVG children in a <g> and enable wheel-zoom (to cursor) + drag-pan.
   Adds zoom +/- /reset controls into the stage. */
function attachZoomPan(stage, svg){
  const NS='http://www.w3.org/2000/svg';
  // move existing children into a viewport group
  const vp=document.createElementNS(NS,'g');
  while(svg.firstChild) vp.appendChild(svg.firstChild);
  svg.appendChild(vp);
  const apply=()=>vp.setAttribute('transform',`translate(${mapView.x},${mapView.y}) scale(${mapView.k})`);
  if(!mapView.init){ mapView={k:1,x:0,y:0,init:true}; }
  apply();

  // convert a client point to svg-user coords (accounts for viewBox scaling)
  const toSvg=(clientX,clientY)=>{
    const pt=svg.createSVGPoint(); pt.x=clientX; pt.y=clientY;
    const m=svg.getScreenCTM(); if(!m) return {x:clientX,y:clientY};
    const p=pt.matrixTransform(m.inverse()); return {x:p.x,y:p.y};
  };
  svg.addEventListener('wheel',(e)=>{
    e.preventDefault();
    const before=toSvg(e.clientX,e.clientY);
    const factor=e.deltaY<0 ? 1.12 : 1/1.12;
    const nk=Math.max(0.2,Math.min(6,mapView.k*factor));
    // keep the point under the cursor fixed
    mapView.x = before.x - (before.x - mapView.x) * (nk/mapView.k);
    mapView.y = before.y - (before.y - mapView.y) * (nk/mapView.k);
    mapView.k = nk; apply();
  },{passive:false});
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  svg.addEventListener('pointerdown',(e)=>{ dragging=true; svg.classList.add('grabbing'); sx=e.clientX; sy=e.clientY; ox=mapView.x; oy=mapView.y; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove',(e)=>{ if(!dragging)return; const m=svg.getScreenCTM(); const s=m?m.a:1; mapView.x=ox+(e.clientX-sx)/s; mapView.y=oy+(e.clientY-sy)/s; apply(); });
  const end=()=>{ dragging=false; svg.classList.remove('grabbing'); };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointerleave',end);

  // zoom controls
  const ctrl=el('div','zoom-ctrl');
  const mk=(txt,fn)=>{ const b=el('button',null,txt); b.onclick=fn; ctrl.appendChild(b); };
  const zoomBy=(f)=>{ const r=svg.getBoundingClientRect(); const c=toSvg(r.left+r.width/2,r.top+r.height/2); const nk=Math.max(0.2,Math.min(6,mapView.k*f)); mapView.x=c.x-(c.x-mapView.x)*(nk/mapView.k); mapView.y=c.y-(c.y-mapView.y)*(nk/mapView.k); mapView.k=nk; apply(); };
  mk('+',()=>zoomBy(1.25)); mk('−',()=>zoomBy(1/1.25)); mk('⤢',()=>{ mapView={k:1,x:0,y:0,init:true}; apply(); });
  stage.appendChild(ctrl);
  const hint=el('div','zoom-hint','scroll = zoom · drag = pan'); stage.appendChild(hint);
}

async function drawMap(){
  const stage=document.getElementById('mapStage'); if(!stage) return;
  let projects;
  try{ projects=await fetchMap(); }catch(e){ stage.innerHTML='<div class="page-empty">Server unreachable.</div>'; return; }
  if(mapLayout==='bubbles') return drawBubbles(stage,projects);
  if(mapLayout==='force') return drawForce(stage,projects);
  return drawRadial(stage,projects);
}

/* ---- shared tree flatten ---- */
function mapNodes(projects){
  // returns {projects:[{p, sessions:[{s, agents:[...]}]}]}
  return projects.map(p=>({ p, sessions:(p.sessions||[]).map(s=>({ s, agents:(mapFilter==='summary')?[]:(s.agents||[]) })) }));
}

/* ---- 1) RADIAL (brain) ---- */
function drawRadial(stage,projects){
  const tree=mapNodes(projects);
  if(!tree.length){ stage.innerHTML='<div class="page-empty">Nothing to map. Try the "everything" filter.</div>'; return; }
  const NS='http://www.w3.org/2000/svg';
  const cx=0, cy=0; // center at origin; we auto-fit the viewBox afterwards
  const svg=document.createElementNS(NS,'svg');
  const edges=document.createElementNS(NS,'g'); const nodes=document.createElementNS(NS,'g');
  svg.appendChild(edges); svg.appendChild(nodes);
  // track bounding box of everything drawn (node center ± radius, plus label room)
  let minX=0,minY=0,maxX=0,maxY=0;
  const grow=(x,y,pad)=>{ minX=Math.min(minX,x-pad); minY=Math.min(minY,y-pad); maxX=Math.max(maxX,x+pad); maxY=Math.max(maxY,y+pad); };
  const node=(cls,x,y,r,label,sub,onclick)=>{
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','mnode '+cls); g.setAttribute('transform',`translate(${x},${y})`);
    const c=document.createElementNS(NS,'circle'); c.setAttribute('r',r); g.appendChild(c);
    if(label){ const t=document.createElementNS(NS,'text'); t.setAttribute('text-anchor','middle'); t.setAttribute('dy',r+13); t.textContent=label; g.appendChild(t); }
    if(sub){ const t=document.createElementNS(NS,'text'); t.setAttribute('class','sub'); t.setAttribute('text-anchor','middle'); t.setAttribute('dy',r+25); t.textContent=sub; g.appendChild(t); }
    if(onclick){ g.style.cursor='pointer'; g.onclick=onclick; }
    nodes.appendChild(g);
    grow(x,y, r + (label?46:6) + (sub?12:0)); // reserve room for labels below the node
    return {x,y};
  };
  const edge=(a,b,hot)=>{ const p=document.createElementNS(NS,'path'); p.setAttribute('class','medge'+(hot?' hot':'')); const mx=(a.x+b.x)/2; p.setAttribute('d',`M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`); edges.appendChild(p); };

  const center=node('n-center',cx,cy,26,'','',null);
  const centerT=document.createElementNS(NS,'text'); centerT.setAttribute('text-anchor','middle'); centerT.setAttribute('dy',4); centerT.setAttribute('style','fill:#cfe0ff;font-weight:700;font-size:12px'); centerT.textContent='YOU'; nodes.appendChild(centerT);

  const nP=tree.length;
  // ring radii scale with how many projects there are (more projects → wider rings so they don't overlap)
  const baseR = 220 + nP*18;
  tree.forEach((pn,pi)=>{
    const ang=(pi/nP)*Math.PI*2 - Math.PI/2;
    const px=cx+Math.cos(ang)*baseR, py=cy+Math.sin(ang)*baseR;
    const anyRun=pn.sessions.some(x=>x.s.status==='running');
    const pNode=node('n-project',px,py,16,pn.p.name.slice(0,22), pn.p.running?pn.p.running+' running':'', ()=>location.search='?project='+encodeURIComponent(pn.p.name));
    edge(center,pNode,anyRun);
    const nS=pn.sessions.length||1;
    // fan sessions outward from the project along the same angle, spread by a small arc
    const spreadS = Math.min(0.55, 1.4/Math.max(nS,1));
    pn.sessions.forEach((sn,si)=>{
      const sAng=ang + (si-(nS-1)/2)*spreadS;
      const sr=baseR+130;
      const sx=cx+Math.cos(sAng)*sr, sy=cy+Math.sin(sAng)*sr;
      const sNode=node('n-session',sx,sy,9,sn.s.issueId,'', ()=>location.search='?project='+encodeURIComponent(pn.p.name));
      edge(pNode,sNode,sn.s.status==='running');
      const nA=sn.agents.length||0;
      const spreadA = Math.min(0.3, 0.9/Math.max(nA,1));
      sn.agents.forEach((a,ai)=>{
        const aAng=sAng + (ai-(nA-1)/2)*spreadA;
        const ar=sr+80;
        const ax=cx+Math.cos(aAng)*ar, ay=cy+Math.sin(aAng)*ar;
        node(agentClass(a),ax,ay,6, a.status==='running'?a.name.slice(0,18):'', '', null);
        if(a.status==='running') nodes.lastChild.classList.add('pulse');
        edge(sNode,{x:ax,y:ay}, a.status==='running');
      });
    });
  });
  // auto-fit viewBox to the real content bounds + margin — nothing gets clipped
  const M=40;
  const vbX=minX-M, vbY=minY-M, vbW=(maxX-minX)+M*2, vbH=(maxY-minY)+M*2;
  svg.setAttribute('viewBox',`${vbX} ${vbY} ${vbW} ${vbH}`);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  stage.innerHTML=''; stage.appendChild(svg);
  attachZoomPan(stage,svg);
}

/* ---- 3) FORCE graph (light physics) ---- */
function stopForce(){ if(forceTimer){ cancelAnimationFrame(forceTimer); forceTimer=null; } }
function drawForce(stage,projects){
  stage.style.minHeight=''; stage.style.background=''; stage.style.border='';
  const W=stage.clientWidth||1000, H=Math.max(stage.clientHeight,520);
  const NS='http://www.w3.org/2000/svg';
  const tree=mapNodes(projects);
  // build nodes/links
  const nodes=[{id:'center',type:'center',label:'YOU',x:W/2,y:H/2,fx:W/2,fy:H/2}];
  const links=[];
  const rnd=(i)=>({x:W/2+Math.cos(i)*180+((i*97)%120-60), y:H/2+Math.sin(i)*180+((i*53)%120-60)});
  let i=0;
  tree.forEach(pn=>{
    const pid='p:'+pn.p.name; const pos=rnd(++i);
    nodes.push({id:pid,type:'project',label:pn.p.name.slice(0,18),x:pos.x,y:pos.y,vx:0,vy:0,data:pn.p});
    links.push(['center',pid, pn.p.running>0]);
    pn.sessions.forEach(sn=>{
      const sid=pid+'/'+sn.s.issueId; const sp=rnd(++i);
      nodes.push({id:sid,type:'session',label:sn.s.issueId,x:sp.x,y:sp.y,vx:0,vy:0});
      links.push([pid,sid, sn.s.status==='running']);
      sn.agents.forEach(a=>{
        const aid=sid+'/'+a.id; const ap=rnd(++i);
        nodes.push({id:aid,type:'agent',status:a.status,label:a.status==='running'?a.name.slice(0,16):'',x:ap.x,y:ap.y,vx:0,vy:0});
        links.push([sid,aid, a.status==='running']);
      });
    });
  });
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const eg=document.createElementNS(NS,'g'), ng=document.createElementNS(NS,'g'); svg.appendChild(eg); svg.appendChild(ng);
  const R={center:24,project:15,session:8,agent:6};
  const lines=links.map(([a,b,hot])=>{ const l=document.createElementNS(NS,'line'); l.setAttribute('class','medge'+(hot?' hot':'')); eg.appendChild(l); return {l,a,b}; });
  const gEls=nodes.map(n=>{
    const cls = n.type==='agent' ? ('n-agent '+(n.status||'unknown')) : ('n-'+n.type);
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','mnode '+cls+(n.type==='agent'&&n.status==='running'?' pulse':''));
    const c=document.createElementNS(NS,'circle'); c.setAttribute('r',R[n.type]); g.appendChild(c);
    if(n.label){ const t=document.createElementNS(NS,'text'); t.setAttribute('text-anchor','middle'); t.setAttribute('dy',R[n.type]+12); t.textContent=n.label; g.appendChild(t); }
    if(n.type==='center'){ const t=document.createElementNS(NS,'text');t.setAttribute('text-anchor','middle');t.setAttribute('dy',4);t.setAttribute('style','fill:#cfe0ff;font-weight:700;font-size:11px');t.textContent='YOU';g.appendChild(t); }
    if(n.type==='project'){ g.style.cursor='pointer'; g.onclick=()=>location.search='?project='+encodeURIComponent(n.data.name); }
    ng.appendChild(g); return g;
  });
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  stage.innerHTML=''; stage.appendChild(svg);
  attachZoomPan(stage,svg);
  // simple force sim
  let ticks=0;
  function step(){
    ticks++;
    for(const n of nodes){ if(n.fx!=null) continue; n.vx*=0.85; n.vy*=0.85; }
    // repulsion
    for(let a=0;a<nodes.length;a++)for(let b=a+1;b<nodes.length;b++){
      const na=nodes[a],nb=nodes[b]; let dx=na.x-nb.x,dy=na.y-nb.y; let d2=dx*dx+dy*dy||1; if(d2>40000)continue;
      const f=1200/d2; const d=Math.sqrt(d2); dx/=d;dy/=d;
      if(na.fx==null){na.vx+=dx*f;na.vy+=dy*f;} if(nb.fx==null){nb.vx-=dx*f;nb.vy-=dy*f;}
    }
    // springs
    for(const {a,b} of lines){ const na=byId[a],nb=byId[b]; let dx=nb.x-na.x,dy=nb.y-na.y; const d=Math.sqrt(dx*dx+dy*dy)||1; const f=(d-90)*0.01; dx/=d;dy/=d;
      if(na.fx==null){na.vx+=dx*f;na.vy+=dy*f;} if(nb.fx==null){nb.vx-=dx*f;nb.vy-=dy*f;} }
    for(const n of nodes){ if(n.fx!=null){n.x=n.fx;n.y=n.fy;continue;} n.x+=n.vx;n.y+=n.vy; n.x=Math.max(20,Math.min(W-20,n.x)); n.y=Math.max(20,Math.min(H-20,n.y)); }
    nodes.forEach((n,idx)=>gEls[idx].setAttribute('transform',`translate(${n.x},${n.y})`));
    for(const {l,a,b} of lines){ const na=byId[a],nb=byId[b]; l.setAttribute('x1',na.x);l.setAttribute('y1',na.y);l.setAttribute('x2',nb.x);l.setAttribute('y2',nb.y); }
    if(ticks<300) forceTimer=requestAnimationFrame(step);
  }
  stopForce(); step();
  if(!tree.length) stage.innerHTML='<div class="page-empty">Nothing to show. Try the "everything" filter.</div>';
}

    document.getElementById('metaText').textContent=sessions.length+' session(s)';
    const root=document.getElementById('root'); root.innerHTML='';
    if(!sessions.length){ root.appendChild(el('div','page-empty', activeOnly?'No active sessions right now.':'No sessions yet. Run <code>/orchestrate &lt;ISSUE-ID&gt;</code>.')); return; }
    // active first: running → blocked → planned/unknown → done; then most-recent within each group
    const rank={running:0,blocked:1,planned:2,unknown:2,done:3};
    sessions.sort((a,b)=>{
      const ra=rank[a.status]??2, rb=rank[b.status]??2;
      if(ra!==rb) return ra-rb;
      return (b.updatedAt||b.createdAt||'').localeCompare(a.updatedAt||a.createdAt||'');
    });
    const cont=el('div','sessions'); sessions.forEach(s=>cont.appendChild(session(s))); root.appendChild(cont);
  }catch(e){ document.getElementById('root').innerHTML='<div class="page-empty">Server unreachable.</div>'; }
}

document.getElementById('activeOnly').addEventListener('change',e=>{ activeOnly=e.target.checked; localStorage.setItem('cfa_activeOnly',activeOnly?'1':'0'); render(); });
render();
setInterval(()=>{
  // On the Map view, refresh data in place (don't rebuild toolbar / restart force).
  if(qs('view')==='map'){
    const stage=document.getElementById('mapStage');
    if(stage && mapLayout!=='force'){ drawMap(); }   // radial/bubbles: cheap full redraw
    // force layout: leave the running sim alone; it self-settles and re-renders on layout/filter change
    return;
  }
  render();
},1600);
</script>
