name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + copy templates)
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check package is agnostic (no client/project names)
        run: |
          if grep -rniE "adiantamento|finpass|media-player|goleiro|dmpeople" src templates README.md; then
            echo "::error::Found a client/project-specific name — the package must stay agnostic."
            exit 1
          fi
          echo "OK: no client/project names found."
